name: Publish Python to PyPI if RELEASE

on:
  push:
    tags:
      - "RELEASE*"

permissions:
  id-token: write # This is required for requesting the JWT
  contents: read  # This is required for actions/checkout

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, to check that the tag is on main

      - name: Set up uv and python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Check that the tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version=$(uv version --short)
          if [ "$GITHUB_REF_NAME" != "RELEASE$version" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in pyproject.toml"
            exit 1
          fi

      - name: Run tests
        run: uv run --locked pytest CausalDisco/tests/tests.py

      - name: Build release artifacts
        run: uv build

      - name: Publish package to PyPI
        run: uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
