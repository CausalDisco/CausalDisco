name: Build documentation

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write # Required for pushing the documentation files

# Never deploy in parallel, to avoid race conditions while pushing to gh-pages.
concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v5

      - name: Set up uv and python 3.12
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Build docs
        run: uv run --locked --group docs sphinx-build -b html docs website/docs

      # pull requests only check that the docs build
      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: website/docs
